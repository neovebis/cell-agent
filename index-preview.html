const referenceNavPaths={"chat":"<path d=\"M12.3 3.1C7.2 3.1 3.1 7.1 3.1 12.1c0 1.35.28 2.57.82 3.77L3.1 21l5.07-1.16c1.18.56 2.62.85 4.13.85 5.17 0 9.35-3.92 9.35-8.76 0-4.89-4.18-8.83-9.35-8.83Z\"/>","camera":"<path d=\"M3.25 8.2h3.32c.54 0 1.03-.27 1.3-.72L9.16 5.4h5.64l1.25 2.08c.27.45.76.72 1.3.72h3.4c.8 0 1.45.65 1.45 1.46V19a1.55 1.55 0 0 1-1.55 1.55H3.35A1.55 1.55 0 0 1 1.8 19V9.66c0-.81.64-1.46 1.45-1.46Z\"/><circle cx=\"12\" cy=\"14.3\" r=\"3.3\"/>","connector":"<path d=\"M9 3.3v4.1M15 3.3v4.1\"/><path d=\"M7 7.55h10v3.1a5 5 0 0 1-5 5 5 5 0 0 1-5-5v-3.1Z\"/><path d=\"M12 15.75v4.95\"/>","activity":"<path d=\"M2.8 5.1h7.05M14.1 5.1h7.1M12 2.9v4.4M2.8 12h4.5M11.5 12h9.7M9.4 9.8v4.4M2.8 18.9h11.1M18.1 18.9h3.1M16 16.7v4.4\"/>","profile":"<path d=\"M12 11a3.6 3.6 0 1 0 0-7.2 3.6 3.6 0 0 0 0 7.2Z\"/><path d=\"M4.55 19.6c1.55-2.95 4.28-4.4 7.45-4.4 3.17 0 5.9 1.45 7.45 4.4\"/>"};
const tabToReferenceIcon={Chat:'chat',Capture:'camera',Conectores:'connector',Atividade:'activity',Perfil:'profile'};
function navIco(tab){return `<i class="ico nav-reference-ico"><svg viewBox="0 0 24 24" aria-hidden="true">${referenceNavPaths[tabToReferenceIcon[tab]]}</svg></i>`}
function nav(){return `<nav class="nav" aria-label="Navegação principal">${names.map((n,i)=>`<button class="${n===state.tab?'active':''}" onclick="go('${n}')">${navIco(n)}<span>${n}</span></button>`).join('')}</nav>`}
function go(tab){state.tab=tab;state.active=null;state.sheet=null;render()}
function agents(){return `<div class="view"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="kicker">Os teus espaços de trabalho</div><h1 class="title">Agentes</h1></div><button class="button-icon" aria-label="Criar agente" onclick="openSheet('create')">${ico('plus')}</button></div><p class="tiny muted" style="margin-top:-3px;margin-bottom:20px">Pré-visualização · Agentes de demonstração</p>${state.agents.map(a=>`<button class="card agent-card" onclick="openAgent('${a.id}')">${avatar()}<div class="grow"><strong>${esc(a.name)}</strong><div class="sub muted">${esc(a.desc)}</div></div>${ico('next')}</button>`).join('')}</div>`}
function openAgent(id){state.active=id;render()}
function sendMsg(){const input=document.querySelector('#compose-input');if(!input||!input.value.trim())return;const t=input.value.trim();(state.messages[state.active]??=[]).push(t);render();toast('Mensagem guardada apenas na prévia. Ainda não está ligada a uma IA.')}
function chat(){const a=state.agents.find(x=>x.id===state.active);const messages=state.messages[a.id]||[];return `<div class="chat-view"><header class="chat-header"><button class="button-icon" aria-label="Voltar" onclick="state.active=null;render()">${ico('back')}</button>${avatar(43)}<div class="grow"><strong style="font-size:19px">${esc(a.name)}</strong><div class="tiny muted">Agente</div></div><button class="button-icon" onclick="toast('Mais opções: integração do backend pendente')">${ico('more')}</button></header><div class="chat-content">${messages.length?messages.map(x=>`<div class="message me"><div class="bubble">${esc(x)}</div></div>`).join(''):`<div class="chat-empty">${avatar(72)}<h2>Como posso ajudar?</h2><p class="tiny muted">Envia uma mensagem a ${esc(a.name)}.</p><p class="tiny muted" style="margin-top:12px">Modo demo: sem respostas de IA.</p></div>`}</div><form class="composer" onsubmit="event.preventDefault();sendMsg()"><textarea id="compose-input" placeholder="Escrever" aria-label="Escrever mensagem"></textarea><div class="composer-tools"><button type="button" class="button-icon" onclick="toast('Anexos via Capture após integração')">${ico('plus')}</button><span class="agent-chip">${avatar(25)}<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.name)}</span>${ico('down')}</span><span class="grow"></span><button type="button" class="button-icon" onclick="toast('Voz ainda não integrada')">${ico('audio')}</button><button aria-label="Enviar" type="submit" class="button-icon circle-black">${ico('up')}</button></div></form></div>`}
function capture(){return `<div class="view"><div class="kicker">O mundo físico entra aqui</div><h1 class="title">Capture</h1><button class="card capture-main" onclick="openSheet('capture')"><span class="camera-badge">${ico('camera')}</span><h2>Capturar</h2><div class="muted">Vai para a biblioteca</div></button><div class="caps">RECENTES</div>${state.captures.length?state.captures.map((x,i)=>`<button class="card recents" onclick="toast('${esc(x.title)} · apenas nesta prévia')"><div class="grow"><strong style="font-size:17px">${esc(x.title)}</strong><div class="tiny muted" style="margin-top:8px">${esc(x.source)} · agora · Demo</div></div><span class="tag">${esc(x.source)}</span></button>`).join(''):`<div class="card center-empty">Nenhum conteúdo capturado ainda.<p class="tiny muted">Toca em Capturar para começar.</p></div>`}<p class="tiny muted" style="margin-top:20px">A prévia guarda conteúdo apenas nesta página, sem sincronização.</p></div>`}
const connectors=[['Google Drive','Conectores','Ficheiros e documentos'],['GitHub','Conectores','Repositórios e código'],['Plugin de pesquisa','Plugins','Ferramentas especializadas'],['Servidor MCP','MCP','Ferramentas remotas'],['Análise de dados','Skills','Procedimentos reutilizáveis'],['Cell de automação','Cells','Capacidade do CELL SYSTEM']];
function conn(){return `<div class="view"><div class="kicker">Ferramentas e capacidades</div><h1 class="title">Conectores</h1><div class="chips">${['Tudo','Conectores','Plugins','MCP','Skills','Cells'].map(x=>`<button class="chip ${state.filter===x?'on':''}" onclick="state.filter='${x}';render()">${x}</button>`).join('')}</div><p class="tiny muted">Catálogo ilustrativo · Não ligado às contas reais</p>${connectors.filter(x=>state.filter==='Tudo'||state.filter===x[1]).map(x=>`<button class="card recents" onclick="toast('Ligação real de ${esc(x[0])}: depende do backend partilhado')"><div class="button-icon" style="background:#fff">${ico(x[1]==='MCP'?'connector':'shield')}</div><div class="grow"><strong>${esc(x[0])}</strong><div class="tiny muted" style="margin-top:4px">${esc(x[2])}</div><div class="tiny muted" style="margin-top:5px">Não ligado · ${esc(x[1])}</div></div>${ico('next')}</button>`).join('')}</div>`}
function activity(){return `<div class="view"><div class="kicker">Tudo o que acontece</div><h1 class="title">Atividade</h1><div class="chips" style="padding-top:3px">${['Todas','Ativas','Concluídas'].map(x=>`<button class="chip ${state.afilter===x?'on':''}" onclick="state.afilter='${x}';render()">${x}</button>`).join('')}</div><div class="card center-empty">${ico('check')}<p>Sem atividade para apresentar.</p><p class="tiny">As missões reais dos teus agentes aparecerão aqui.</p></div></div>`}
function profile(){return `<div class="view"><div class="kicker">A tua conta</div><h1 class="title">Perfil</h1><div class="card recents" style="text-align:left"><div class="avatar" style="font-size:30px;color:#fff">${ico('profile')}</div><div class="grow"><strong style="font-size:21px">Demonstração</strong><div class="tiny muted" style="margin-top:7px">Sem sessão ligada ao servidor</div></div></div><button class="card setting" onclick="openSheet('settings')">${ico('settings')}<div class="grow"><strong>Definições</strong><div class="tiny muted" style="margin-top:5px">Notificações, privacidade e sessão</div></div>${ico('next')}</button><p class="tiny muted">Os utilizadores do CELL SYSTEM não são recriados nesta aplicação.</p></div>`}
function openSheet(type){state.sheet=type;render()}
function closeSheet(){state.sheet=null;render()}
function makeAgent(){const name=document.querySelector('#new-name').value.trim(),desc=document.querySelector('#new-desc').value.trim();if(!name)return toast('Escreve o nome do agente.');const id='x'+Date.now();state.agents.unshift({id,name,desc:desc||'Novo agente'});state.sheet=null;state.tab='Chat';state.active=id;render()}
function addNote(){const note=document.querySelector('#capture-note')?.value||'';const t=document.querySelector('#capture-text')?.value||'';if(!t.trim())return toast('Escreve o texto a guardar.');state.captures.unshift({title:t.trim().slice(0,42),source:'Texto',note});closeSheet()}
function captureAction(label){if(label==='Texto'){state.sheet='text';render();return}toast(label==='Foto'||label==='Vídeo'||label==='Galeria'||label==='Documento'?'Abre o projeto Expo no telemóvel para usar esta captura nativa.':`A captura de ${label.toLowerCase()} ainda está prevista, mas não integrada.`)}
function sheet(){if(!state.sheet)return'';const kind=state.sheet;let body='';if(kind==='create')body=`<h2 class="menuTitle">Criar agente</h2><label class="tiny muted" for="new-name">NOME</label><input id="new-name" class="field" placeholder="Ex.: Eliot"><label class="tiny muted" for="new-desc">DESCRIÇÃO</label><textarea id="new-desc" class="field" placeholder="O que vai fazer este agente?" style="height:90px"></textarea><p class="tiny muted">Criado apenas nesta sessão de pré-visualização.</p><button class="pill" style="width:100%;margin-top:16px" onclick="makeAgent()">Criar agente</button>`;
if(kind==='capture')body=`<textarea id="capture-note" class="note" placeholder="Nota ou contexto (opcional)"></textarea><div class="choice-grid">${[['Foto','camera'],['Vídeo','video'],['Galeria','image'],['Documento','doc'],['Áudio','audio'],['Ecrã','phone'],['Texto','text'],['Localização','location']].map(([name,ic])=>`<button onclick="captureAction('${name}')">${ico(ic)} ${name}</button>`).join('')}</div>`;
if(kind==='text')body=`<h2 class="menuTitle">Capturar texto</h2><textarea id="capture-text" class="note" placeholder="Escreve uma nota para a biblioteca..." style="height:180px"></textarea><button class="pill" style="margin-top:25px;width:100%" onclick="addNote()">Guardar na biblioteca</button>`;
if(kind==='settings')body=`<h2 class="menuTitle">Definições</h2><button class="card setting" onclick="toast('As notificações push remotas exigem a app Expo e o backend partilhado')">${ico('bell')}<div class="grow"><strong>Notificações</strong><div class="tiny muted">Avisos, missões e aprovações</div></div>${ico('next')}</button><button class="card setting" onclick="toast('Sem base de dados ou sistema de utilizadores separado')">${ico('shield')}<strong>Privacidade e permissões</strong></button>`;
return `<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="handle"></div>${body}</div></div>`}
let timer;function toast(t){const old=document.querySelector('.notice');if(old)old.remove();let n=document.createElement('div');n.className='notice';n.textContent=t;document.querySelector('.app').append(n);clearTimeout(timer);timer=setTimeout(()=>n.remove(),3400)}
function render(){const p=state.tab==='Chat'?(state.active?chat():agents()):state.tab==='Capture'?capture():state.tab==='Conectores'?conn():state.tab==='Atividade'?activity():profile();document.getElementById('root').innerHTML=`${p}${state.active?'':nav()}<span class="mini-demo">DEMO</span>${sheet()}`;}
render();
</script></body></html>
