name: Publish CELL AGENT v0.3.0 once
on:
  push:
    branches:
      - codex/cell-agent-runtime
    paths:
      - .github/workflows/publish-cell-agent-v0.3.0.yml
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download verified Android artifact
        run: |
          set -euo pipefail
          gh run download 42528606991 --repo "$GITHUB_REPOSITORY" --name cell-agent-mobile-v0.3.0-apk --dir release-assets
          ls -lah release-assets
          test -s release-assets/cell-agent-mobile-v0.3.0.apk
          test -s release-assets/cell-agent-mobile-v0.3.0.apk.sha256
          test -s release-assets/build-info.json
      - name: Verify provenance and integrity
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c cell-agent-mobile-v0.3.0.apk.sha256
          jq -e '.version == "0.3.0" and .versionCode == 6 and .commit == "c0816f92e274c9e10cc7f0fa9c6e38748ac366a9" and .verificationCommit == "64889832f9bd84a170d595024da6ab9b65b17d74" and .canUpdateV022 == false' build-info.json
      - name: Publish GitHub release
        run: |
          set -euo pipefail
          if gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v0.3.0 already exists: refusing to overwrite.'
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## CELL AGENT v0.3.0 — Agent runtime

          Versão Android da aplicação CELL AGENT, proveniente da branch `codex/cell-agent-runtime`, com agente central, Cells, aprovações e tarefas.

          **APK:** `cell-agent-mobile-v0.3.0.apk`
          **Android versionName:** `0.3.0`
          **Android versionCode:** `6`
          **Application ID:** `com.cellsystem.agent.mobile`
          **Código verificado:** `64889832f9bd84a170d595024da6ab9b65b17d74`
          **Proveniência da APK compilada:** `c0816f92e274c9e10cc7f0fa9c6e38748ac366a9`
          **Validação:** GitHub Actions #42528606991 (integridade, assinatura v2, manifesto e versão).

          ### Atenção à atualização
          A comparação dos certificados confirmou `canUpdateV022: false`. Por usar uma assinatura distinta, a APK v0.3.0 **não pode ser instalada diretamente como atualização da v0.2.2**. Faça primeiro cópia de segurança de quaisquer dados locais importantes antes de considerar desinstalar a versão anterior. A desinstalação pode apagar dados locais.

          A verificação automatizada passou, mas não equivale a um teste de instalação ou funcionamento em dispositivo físico.

          Incluímos o ficheiro SHA-256 e o registo `build-info.json` para permitir verificação independente.
          EOF
          gh release create v0.3.0             release-assets/cell-agent-mobile-v0.3.0.apk             release-assets/cell-agent-mobile-v0.3.0.apk.sha256             release-assets/build-info.json             --repo "$GITHUB_REPOSITORY"             --target 64889832f9bd84a170d595024da6ab9b65b17d74             --title 'CELL AGENT v0.3.0'             --notes-file release-notes.md             --latest
