name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          echo "ANDROID_HOME is $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_CELL_API_URL: https://cell-griot.pages.dev
          EXPO_PUBLIC_SUPABASE_URL: https://oxulnwbwpfxwjbvxlrga.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_aEBNlthmZizezIeYKodSnw_0ndTYG42

      - name: Setup Keystore & Signing Config
        run: |
          mkdir -p android/app
          if [ -f "release.keystore" ]; then
            echo "Using persistent repository release keystore"
            cp release.keystore android/app/release.keystore
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using custom keystore from repository secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          else
            echo "Generating self-signed release keystore for standalone APK"
            keytool -genkeypair -v -storetype PKCS12 -keystore android/app/release.keystore \
              -alias cellagent -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CELL AGENT, OU=Mobile, O=CellSystem, L=Luanda, ST=Luanda, C=AO" \
              -storepass cellagent123 -keypass cellagent123
          fi
          export KEY_ALIAS="cellagent"
          export STORE_PASS="cellagent123"
          export KEY_PASS="cellagent123"
          node scripts/configure-signing.js

      - name: Build Android Release APK
        env:
          EXPO_PUBLIC_CELL_API_URL: https://cell-griot.pages.dev
          EXPO_PUBLIC_SUPABASE_URL: https://oxulnwbwpfxwjbvxlrga.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_aEBNlthmZizezIeYKodSnw_0ndTYG42
          GRADLE_OPTS: "-Xmx3072m -XX:MaxMetaspaceSize=512m -Dorg.gradle.jvmargs=-Xmx3072m"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Prepare, Zipalign & Sign APK
        run: |
          mkdir -p build-output
          APK_RAW=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_RAW" ]; then
            echo "Error: No APK file was generated!"
            exit 1
          fi
          echo "Raw APK located: $APK_RAW"

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          # 1. Zipalign (4-byte alignment for uncompressed .so libraries and assets)
          echo "Running zipalign..."
          "$ZIPALIGN" -p -f 4 "$APK_RAW" build-output/aligned.apk

          # 2. Sign with apksigner (v1 JAR, v2, and v3 signature schemes)
          echo "Signing with apksigner (v1 + v2 + v3)..."
          "$APKSIGNER" sign \
            --ks android/app/release.keystore \
            --ks-key-alias cellagent \
            --ks-pass pass:cellagent123 \
            --key-pass pass:cellagent123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build-output/cell-agent-mobile-v0.1.9.apk \
            build-output/aligned.apk

          # 3. Verify signature and alignment
          echo "Verifying final APK..."
          "$APKSIGNER" verify --verbose build-output/cell-agent-mobile-v0.1.9.apk
          "$ZIPALIGN" -c 4 build-output/cell-agent-mobile-v0.1.9.apk

          rm -f build-output/aligned.apk
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cell-agent-mobile-v0.1.9-apk
          path: build-output/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE="build-output/cell-agent-mobile-v0.1.9.apk"
          if [ -f "$APK_FILE" ]; then
            echo "Publishing release with APK: $APK_FILE"
            if gh release view v0.1.9 >/dev/null 2>&1; then
              gh release upload v0.1.9 "$APK_FILE" --clobber
            else
              gh release create v0.1.9 "$APK_FILE" \
                --title "CELL AGENT Mobile v0.1.9" \
                --notes "### CELL AGENT Mobile v0.1.9

          APK Android com novo Menu de Ações flutuante, animação fluida do botão '+', opção de copiar mensagens e aba Avançado no Perfil.

          #### Principais Novidades e Otimizações nesta versão:
          - **Compatibilidade Total Android (Zipalign & v1/v2/v3):** O APK foi 100% alinhado (zipalign 4-byte) e assinado com esquemas v1 (JAR signing), v2 e v3, garantindo instalação sem erros de análise de pacote em qualquer dispositivo Android (Samsung, Xiaomi, Motorola, etc.).
          - **Menu Flutuante Elegante:** Novo menu de ações suspenso idêntico ao modelo com cantos arredondados e ícones descritivos: Criar missão, Câmara, Imagem ou vídeo, Ficheiros, Capture e Plugins.
          - **Animação Avançada do Botão '+':** O botão roda 45 graus de '+' para 'x' com física de mola suave e fluida ao abrir o menu, e regressa ao estado original com elegância ao fechar.
          - **Opção de Copiar Mensagem:** Tocar na mensagem do utilizador faz surgir a opção 'Copiar' instantânea para enviar o conteúdo para a área de transferência com confirmação 'Copiado!'.
          - **Painel Avançado no Perfil:** Limpeza visual do perfil principal. O cofre de credenciais, as variáveis globais, a segurança e os endpoints foram movidos para a secção dedicada 'Avançado' no fim do perfil.

          #### Como instalar no telemóvel:
          > **Importante:** Se tiver uma versão anterior instalada (ex.: v0.1.7 ou v0.1.8), desinstale-a primeiro antes de instalar a v0.1.9 para evitar conflito de certificados.
          1. Descarregue o ficheiro **cell-agent-mobile-v0.1.9.apk** abaixo diretamente no seu smartphone Android.
          2. Certifique-se de que o download foi concluído na totalidade (~64 MB).
          3. Abra o arquivo descarregado e confirme a instalação!"
            fi
          fi
