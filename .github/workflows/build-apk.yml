name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          echo "ANDROID_HOME is $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_CELL_API_URL: https://cell-griot.pages.dev
          EXPO_PUBLIC_SUPABASE_URL: https://oxulnwbwpfxwjbvxlrga.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_aEBNlthmZizezIeYKodSnw_0ndTYG42

      - name: Setup Keystore & Signing Config
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using custom keystore from repository secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            export KEY_ALIAS="${{ secrets.KEYSTORE_ALIAS }}"
            export STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            export KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          else
            echo "Generating self-signed release keystore for standalone APK"
            keytool -genkeypair -v -storetype PKCS12 -keystore android/app/release.keystore \
              -alias cellagent -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CELL AGENT, OU=Mobile, O=CellSystem, L=Luanda, S=Luanda, C=AO" \
              -storepass cellagent123 -keypass cellagent123
            export KEY_ALIAS="cellagent"
            export STORE_PASS="cellagent123"
            export KEY_PASS="cellagent123"
          fi
          node scripts/configure-signing.js

      - name: Build Android Release APK
        env:
          EXPO_PUBLIC_CELL_API_URL: https://cell-griot.pages.dev
          EXPO_PUBLIC_SUPABASE_URL: https://oxulnwbwpfxwjbvxlrga.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_aEBNlthmZizezIeYKodSnw_0ndTYG42
          GRADLE_OPTS: "-Xmx3072m -XX:MaxMetaspaceSize=512m -Dorg.gradle.jvmargs=-Xmx3072m"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_FOUND=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FOUND" ]; then
            echo "APK generated successfully: $APK_FOUND"
            cp "$APK_FOUND" build-output/cell-agent-mobile-v0.1.6.apk
            ls -la build-output/
          else
            echo "Error: No APK file was generated!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cell-agent-mobile-v0.1.6-apk
          path: build-output/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE="build-output/cell-agent-mobile-v0.1.6.apk"
          if [ -f "$APK_FILE" ]; then
            echo "Publishing release with APK: $APK_FILE"
            if gh release view v0.1.6 >/dev/null 2>&1; then
              gh release upload v0.1.6 "$APK_FILE" --clobber
            else
              gh release create v0.1.6 "$APK_FILE" \
                --title "CELL AGENT Mobile v0.1.6" \
                --notes "### CELL AGENT Mobile v0.1.6

          APK Android pronto para instalação direta no telemóvel com integração real do ecossistema CELL.

          #### Principais Atualizações nesta versão:
          - **Zero Agentes Falsos:** Eliminação total de dados simulados. Todos os agentes e nós são consultados em tempo real diretamente da tabela \`cells_workflows\` no Supabase.
          - **Execução Real com Polling & Tick:** Submissão de missões para o motor \`/api/agents/runs\` via Cloudflare Pages com chamada a \`/api/agents/tick\` e escuta do estado real da IA.
          - **Barra do Perfil & Gestão de Espaços:** Seletor interativo de Workspace com suporte multi-tenancy, estado da sessão Supabase (JWT + TLS 1.3), Cofre de Credenciais cifradas (AES-GCM), Variáveis Globais (\$vars), Mecanismos de Segurança e Endpoints de Produção.
          - **Menu 3 Pontos no Chat (Definições do Agente):** Modal completo para configurar Provedor (Google, OpenAI, Anthropic, Groq, Mistral, DeepSeek), Modelo, Prompt de Sistema, Temperatura, Loops de Execução e Matriz de Permissões (\`AgentGrants\` com Sandbox, Pesquisa Web, Edição de Grafo, Efeitos Externos e Verificação).
          - **Capture Real:** Captura com suporte a base64, anexação direta na conversa e ação de envio imediato de qualquer fotografia, documento ou nota para o contexto de um agente.

          #### Como instalar no telemóvel:
          1. Baixe o ficheiro **cell-agent-mobile-v0.1.6.apk** abaixo diretamente no seu telemóvel Android.
          2. Abra o arquivo descarregado e confirme a instalação (ative 'Permitir desta fonte' se solicitado).
          3. Abra o **CELL AGENT** e aceda à sua conta!"
            fi
          fi
