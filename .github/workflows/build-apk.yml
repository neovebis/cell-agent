name: Build Android APK
on:
  push:
    branches: [main, master, 'fix/**', 'release/**']
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Optional run containing a compiled APK candidate to verify without rebuilding
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: cell-agent-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ inputs.candidate_run_id == '' }}
    name: Build signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_CELL_API_URL: https://cell-griot.pages.dev
      EXPO_PUBLIC_SUPABASE_URL: https://oxulnwbwpfxwjbvxlrga.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_aEBNlthmZizezIeYKodSnw_0ndTYG42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check persistent signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_ALIAS" && test -n "$STORE_PASS" && test -n "$KEY_PASS" || { echo 'Persistent Android signing secrets are required. No replacement key will be generated.'; exit 1; }
      - name: Install and check the app
        run: |
          npm ci --no-audit --no-fund
          npx expo install --check
          npm run typecheck
          npm test
      - name: Read app version
        id: metadata
        run: |
          node -e 'const c=require("./app.json").expo; if(c.version!==require("./package.json").version || !Number.isInteger(c.android.versionCode)) process.exit(1); console.log("version="+c.version); console.log("versionCode="+c.android.versionCode)' >> "$GITHUB_OUTPUT"
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Configure persistent release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          keytool -list -keystore android/app/release.keystore -alias "$KEY_ALIAS" -storepass:env STORE_PASS > /dev/null
          node scripts/configure-signing.js
      - name: Build release APK
        working-directory: android
        env:
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: '-Xmx3072m -XX:MaxMetaspaceSize=512m -Dorg.gradle.jvmargs=-Xmx3072m'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace
      - name: Preserve compiled APK candidate
        uses: actions/upload-artifact@v4
        with:
          name: cell-agent-native-apk-candidate
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 5
          if-no-files-found: error
      - name: Verify and package the APK
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
          APP_VERSION_CODE: ${{ steps.metadata.outputs.versionCode }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify-android-apk.sh
      - name: Upload installable app
        uses: actions/upload-artifact@v4
        with:
          name: cell-agent-mobile-v${{ steps.metadata.outputs.version }}-apk
          path: build-output/
          retention-days: 30
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f android/app/release.keystore
  verify_candidate:
    if: ${{ inputs.candidate_run_id != '' }}
    name: Verify compiled Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check APK metadata helpers
        run: npm test
      - name: Check candidate provenance and download
        env:
          SOURCE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          test "$(jq -r .path "$RUNNER_TEMP/candidate-run.json")" = '.github/workflows/build-apk.yml'
          SOURCE_COMMIT=$(jq -r .head_sha "$RUNNER_TEMP/candidate-run.json")
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git diff --quiet "$SOURCE_COMMIT" HEAD -- . ':!.github/**' ':!tests/**' ':!README.md' ':!scripts/read-apk-certificate.cjs' ':!scripts/verify-android-apk.sh'
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name cell-agent-native-apk-candidate --dir android/app/build/outputs/apk/release
          test -s android/app/build/outputs/apk/release/app-release.apk
          echo "APK_SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
      - name: Read app version
        id: metadata
        run: |
          node -e 'const c=require("./app.json").expo; if(c.version!==require("./package.json").version || !Number.isInteger(c.android.versionCode)) process.exit(1); console.log("version="+c.version); console.log("versionCode="+c.android.versionCode)' >> "$GITHUB_OUTPUT"
      - name: Check expected signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_ALIAS" && test -n "$STORE_PASS"
          umask 077
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          keytool -list -keystore android/app/release.keystore -alias "$KEY_ALIAS" -storepass:env STORE_PASS > /dev/null
      - name: Verify and package the APK
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
          APP_VERSION_CODE: ${{ steps.metadata.outputs.versionCode }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify-android-apk.sh
      - name: Upload installable app
        uses: actions/upload-artifact@v4
        with:
          name: cell-agent-mobile-v${{ steps.metadata.outputs.version }}-apk
          path: build-output/
          retention-days: 30
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f android/app/release.keystore
