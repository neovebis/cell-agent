name: Build Android APK
on:
  push:
    branches: [main, master, 'fix/**', 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cell-agent-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_CELL_API_URL: https://cell-griot.pages.dev
      EXPO_PUBLIC_SUPABASE_URL: https://oxulnwbwpfxwjbvxlrga.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_aEBNlthmZizezIeYKodSnw_0ndTYG42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check persistent signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_ALIAS" && test -n "$STORE_PASS" && test -n "$KEY_PASS" || { echo 'Persistent Android signing secrets are required. No replacement key will be generated.'; exit 1; }
      - name: Install and check the app
        run: |
          npm ci --no-audit --no-fund
          npx expo install --check
          npm run typecheck
          npm test
      - name: Read app version
        id: metadata
        run: |
          node -e 'const c=require("./app.json").expo; if(c.version!==require("./package.json").version || !Number.isInteger(c.android.versionCode)) process.exit(1); console.log("version="+c.version); console.log("versionCode="+c.android.versionCode)' >> "$GITHUB_OUTPUT"
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Configure persistent release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          keytool -list -keystore android/app/release.keystore -alias "$KEY_ALIAS" -storepass:env STORE_PASS > /dev/null
          node scripts/configure-signing.js
      - name: Build release APK
        working-directory: android
        env:
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: '-Xmx3072m -XX:MaxMetaspaceSize=512m -Dorg.gradle.jvmargs=-Xmx3072m'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace
      - name: Preserve compiled APK candidate
        uses: actions/upload-artifact@v4
        with:
          name: cell-agent-native-apk-candidate
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 5
          if-no-files-found: error
      - name: Verify and package the APK
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
          APP_VERSION_CODE: ${{ steps.metadata.outputs.versionCode }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          mkdir -p build-output
          "$TOOLS/zipalign" -c -P 16 4 "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee build-output/signature.txt
          keytool -exportcert -keystore android/app/release.keystore -alias "$KEY_ALIAS" -storepass:env STORE_PASS -file "$RUNNER_TEMP/expected-certificate.der"
          EXPECTED=$(sha256sum "$RUNNER_TEMP/expected-certificate.der" | cut -d ' ' -f 1)
          ACTUAL=$(node scripts/read-apk-certificate.cjs build-output/signature.txt)
          test "$EXPECTED" = "$ACTUAL"
          "$TOOLS/aapt2" dump badging "$APK" > build-output/manifest.txt
          grep -F "name='com.cellsystem.agent.mobile'" build-output/manifest.txt
          grep -F "versionCode='$APP_VERSION_CODE'" build-output/manifest.txt
          grep -F "versionName='$APP_VERSION'" build-output/manifest.txt
          if grep -q 'application-debuggable' build-output/manifest.txt; then echo 'Unexpected debuggable APK'; exit 1; fi
          gh release download v0.2.2 --repo neovebis/cell-agent --pattern '*.apk' --dir "$RUNNER_TEMP/baseline"
          "$TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/baseline/cell-agent-mobile-v0.2.2.apk" > build-output/baseline-signature.txt
          BASELINE=$(node scripts/read-apk-certificate.cjs build-output/baseline-signature.txt)
          UPGRADE=false
          if [ "$BASELINE" = "$ACTUAL" ]; then UPGRADE=true; fi
          jq -n --arg version "$APP_VERSION" --argjson versionCode "$APP_VERSION_CODE" --arg commit "$GITHUB_SHA" --arg certificateSHA256 "$ACTUAL" --argjson canUpdateV022 "$UPGRADE" '{version:$version,versionCode:$versionCode,commit:$commit,certificateSHA256:$certificateSHA256,canUpdateV022:$canUpdateV022}' > build-output/build-info.json
          cp "$APK" "build-output/cell-agent-mobile-v$APP_VERSION.apk"
          (cd build-output && sha256sum "cell-agent-mobile-v$APP_VERSION.apk" > "cell-agent-mobile-v$APP_VERSION.apk.sha256")
          cat build-output/build-info.json
      - name: Upload installable app
        uses: actions/upload-artifact@v4
        with:
          name: cell-agent-mobile-v${{ steps.metadata.outputs.version }}-apk
          path: build-output/
          retention-days: 30
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f android/app/release.keystore
